# AurumFlow Live Configuration (Conservative)
# Use this config when starting live trading after shadow-mode validation.
# Same as default, but zmq.enabled is explicitly set.

zmq:
  enabled: true
  pull_addr: "tcp://localhost:5555"
  push_addr: "tcp://localhost:5556"
  timeout_ms: 1000
  reconnect_delay: 2.0

mt5:
  server: "ICMarkets-Demo"
  login: 0
  password: ""
  symbol: "XAUUSD"
  timeout_seconds: 30
  max_retry_attempts: 3

trading:
  enabled: false                     # KEEP FALSE until shadow mode validation passes
  magic_number: 202405
  comment: "AurumFlow v1.0"
  max_spread: 50
  max_slippage: 30
  min_volume: 0.01
  max_volume: 1.0                    # Max 1 lot for conservative mode
  cent_account: false
  account_currency: "USD"
  shadow_initial_balance: 10000

bars:
  buffer_size: 100
  timeframes:
    - "1m"
    - "5m"

risk:
  risk_per_trade: 0.005             # 0.5% risk per trade (half of default)
  max_daily_loss: 0.03              # 3% max daily loss (tighter)
  max_positions: 3                  # Max 3 concurrent positions (fewer)
  max_drawdown_limit: 0.10          # 10% max drawdown (tighter)
  pyramiding_max: 2                 # Max 2 pyramid entries (fewer)
  pyramiding_step_atr: 1.0          # Wider gap between pyramid entries
  trailing_atr_mult: 2.0            # Wider trailing stop
  min_margin_level: 200.0           # Higher margin requirement
  skip_below_min_lot: true
  min_position_size: 0.01

strategy:
  type: "compounder"
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  atr_period: 14

logging:
  level: "INFO"
  file: "logs/aurumflow.log"
  max_bytes: 10485760
  backup_count: 5
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"

monitoring:
  check_interval_seconds: 60
  heartbeat_interval: 300
  account_refresh_seconds: 5